name: Daily MLOps Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Todos los días a las 2:00 AM UTC
  workflow_dispatch:  # Permite ejecución manual

permissions:
  id-token: write
  contents: read

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/705685420706/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-sa@xm-energy-mlops.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install DVC
        run: pip install "dvc[gs]"

      - name: Run DVC Pipeline (Ingest)
        run: dvc repro

      - name: Train Model
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: python -m src.train

      - name: Run Batch Inference
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: python -m src.predict

      - name: Push data to GCS
        run: dvc push

      -      - name: Commit and push DVC metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update DVC metadata after pipeline run" || echo "No changes to commit"
          git push || echo "No changes to push"